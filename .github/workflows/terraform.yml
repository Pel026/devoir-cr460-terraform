name: Terraform Azure Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- Étape 1 : vérification et plan ----------
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

  # ---------- Étape 2 : approbation manuelle, puis apply ----------
  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Apply - créer ACR
        run: terraform apply -auto-approve -input=false -target=azurerm_container_registry.acr

      - name: Rafraichir les sorties
        run: terraform apply -refresh-only -auto-approve -input=false

      - name: Build et push de l'image Docker
        run: |
          ACR_SERVER=$(terraform output -raw acr_login_server)
          ACR_USER=$(terraform output -raw acr_admin_username)
          ACR_PASS=$(terraform output -raw acr_admin_password)
          echo "::add-mask::$ACR_PASS"
          echo "$ACR_PASS" | docker login "$ACR_SERVER" -u "$ACR_USER" --password-stdin
          docker build -t "$ACR_SERVER/devoir-web:v1" ./app
          docker push "$ACR_SERVER/devoir-web:v1"

      - name: Apply - déploiement complet
        run: terraform apply -auto-approve -input=false